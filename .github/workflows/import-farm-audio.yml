name: Import Real Farm Recordings

on:
  push:
    paths:
      - .github/workflows/import-farm-audio.yml
      - scripts/import-farm-alternates.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-recordings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download real-world alternate sounds
        run: bash scripts/import-farm-alternates.sh
      - name: Commit audio files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/sounds/
          if ! git diff --cached --quiet; then
            git commit -m "Bundle licensed real animal and tractor sound recordings"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
