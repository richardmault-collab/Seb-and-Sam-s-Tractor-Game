name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Get game source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate JavaScript syntax
        run: node --check app/src/main/assets/game.js
      - name: Exercise gameplay and counting limit
        run: node tests/smoke.cjs
      - name: Validate new farm game JavaScript
        run: node --check app/src/main/assets/v14.js
      - name: Capture visual checks on Android-size viewport
        continue-on-error: true
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            mkdir -p screenshots
            for scene in home hay drive peek animals guess; do
              URL="file://$GITHUB_WORKSPACE/app/src/main/assets/index.html"
              if [ "$scene" != "home" ]; then URL="$URL?preview=$scene"; fi
              "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
                --allow-file-access-from-files --virtual-time-budget=1800 --window-size=430,900 \
                --screenshot="$GITHUB_WORKSPACE/screenshots/$scene.png" "$URL" >/dev/null 2>&1 || true
            done
          fi
      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seb-and-sam-v14-screen-previews
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify bundled offline assets
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/style.css
          ! grep -Ei 'https?://|<script[^>]+src="https?://' app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: seb-and-sam-tractor-farm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
