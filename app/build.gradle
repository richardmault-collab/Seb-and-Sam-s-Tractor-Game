plugins {
    id 'com.android.application'
}
android {
    namespace 'uk.co.sebandsam.tractorfarm'
    compileSdk 35
    defaultConfig {
        applicationId 'uk.co.sebandsam.tractorfarm'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
